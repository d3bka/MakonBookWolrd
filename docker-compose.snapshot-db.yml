name: makonbook-snapshot

services:
  db:
    image: postgres:16-alpine
    container_name: makonbook-postgres-snapshot
    restart: unless-stopped
    environment:
      POSTGRES_DB: makonbook
      POSTGRES_USER: makonbook
      POSTGRES_PASSWORD: makonbook_snapshot_dev_2026
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - makonbook_snapshot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makonbook -d makonbook"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  makonbook_snapshot_postgres:
