<style>
/* V117: Mid/Final exams (staff) */
.ex117{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;max-width:1180px;margin:0 auto;color:var(--mb50-text,#1c1926)}
.ex117>*{min-width:0}
.ex117-kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mb50-accent,#7438da)}
.ex117 h1{margin:4px 0;font-size:clamp(24px,3vw,32px);line-height:1.15}
.ex117 h2{margin:0 0 4px;font-size:19px}
.ex117 h3{margin:0 0 6px;font-size:16px}
.ex117-sub,.ex117-muted{margin:0;color:var(--mb50-muted,#746c84);line-height:1.5}
.ex117-sub{max-width:780px}
.ex117-muted{font-size:13px}
.ex117-panel{padding:16px 18px;border-radius:18px;border:1px solid var(--mb50-border,#e8e4f0);background:var(--mb50-panel,#fff)}
.ex117-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;align-items:end;margin-top:12px}
.ex117-form label{display:grid;gap:5px;font-size:12px;font-weight:750;color:var(--mb50-muted,#746c84)}
.ex117-form input,.ex117-form select,.ex117-form textarea{width:100%;box-sizing:border-box;padding:9px 11px;border-radius:11px;border:1px solid var(--mb50-border,#e8e4f0);background:var(--mb50-panel,#fff);color:var(--mb50-text,#1c1926);font:inherit;font-size:14px}
.ex117-form .wide{grid-column:1/-1}
.ex117-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px;max-height:280px;overflow:auto;padding:10px;border-radius:12px;border:1px solid var(--mb50-border,#e8e4f0)}
.ex117-checks label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--mb50-text,#1c1926)}
.ex117-checks input{width:auto}
.ex117-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 14px;border-radius:12px;border:1px solid var(--mb50-border,#e8e4f0);background:var(--mb50-panel,#fff);color:var(--mb50-text,#1c1926);font-weight:750;font-size:14px;text-decoration:none;cursor:pointer;line-height:1.2;white-space:nowrap}
.ex117-btn:hover{border-color:var(--mb50-accent,#7438da)}
.ex117-btn.primary{background:#7438da;border-color:transparent;color:#fff}
.ex117-btn.primary:hover{background:#5f2bbd}
.ex117-btn.danger{color:#b91c1c}
.ex117-btn.small{padding:6px 10px;font-size:13px}
.ex117-btn:focus-visible,.ex117 input:focus-visible,.ex117 select:focus-visible,.ex117 summary:focus-visible{outline:3px solid var(--mb62-focus,#8b5cf6);outline-offset:2px}
.ex117-scroll{overflow-x:auto}
.ex117-table{width:100%;border-collapse:collapse;font-size:14px}
.ex117-table th{text-align:left;font-size:12px;font-weight:800;color:var(--mb50-muted,#746c84);padding:8px 10px;border-bottom:1px solid var(--mb50-border,#e8e4f0)}
.ex117-table td{padding:10px;border-bottom:1px solid var(--mb50-border,#e8e4f0);vertical-align:top}
.ex117-table tr:last-child td{border-bottom:0}
.ex117-tag{display:inline-flex;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:800;background:var(--mb50-accent-soft,rgba(116,56,218,.12));color:var(--mb50-accent,#7438da)}
.ex117-tag.warn{background:rgba(245,158,11,.16);color:#b45309}
.ex117-tag.ok{background:rgba(34,197,94,.15);color:#15803d}
.ex117-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ex117-fold{margin-top:10px}
.ex117-fold>summary{cursor:pointer;font-weight:800;list-style:none}
.ex117-fold>summary::-webkit-details-marker{display:none}
.ex117-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.ex117-card{display:grid;gap:6px;padding:14px 16px;border-radius:16px;border:1px solid var(--mb50-border,#e8e4f0);background:var(--mb50-panel,#fff);color:inherit;text-decoration:none}
a.ex117-card:hover{border-color:var(--mb50-accent,#7438da)}
.ex117-empty{padding:28px 20px;text-align:center;border-radius:18px;border:1px dashed var(--mb50-border,#e8e4f0)}
html[data-theme="dark"] .ex117-tag.warn{color:#fcd34d}
html[data-theme="dark"] .ex117-tag.ok{color:#86efac}
</style>
