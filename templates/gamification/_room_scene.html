  <!-- 1. wall -->

      <rect x="72" y="82" width="206" height="206" fill="#d7ecff"/><path d="M72 250C120 226 180 232 278 216V288H72Z" fill="#a8d69a"/><path d="M72 268C150 252 210 262 278 250V288H72Z" fill="#7cc463"/>

      {% endif %}
      <g class="mr-night-sky"><rect x="72" y="82" width="206" height="206" fill="#141842" opacity=".72"/><path d="M246 104A20 20 0 1 0 256 136A16 16 0 1 1 246 104Z" fill="#fff3bf"/><g fill="#fff8dc"><circle cx="98" cy="104" r="1.8"/><circle cx="150" cy="96" r="1.4"/><circle cx="196" cy="126" r="1.6"/><circle cx="120" cy="150" r="1.2"/></g></g>

    <path d="M58 62C70 140 66 220 46 300H70C80 220 82 140 80 62Z" fill="#c9b6ee" opacity=".7"/>
    <path d="M292 62C280 140 284 220 304 300H280C270 220 268 140 270 62Z" fill="#c9b6ee" opacity=".7"/>
    <rect x="46" y="56" width="262" height="8" rx="4" fill="#8a5a3c"/>
  </g>

  <!-- 3. wall art -->
  {% for item in room_slot_map.art.items %}<use href="#ri-{{ item.code }}" data-room-item="{{ item.code }}" data-room-slot="art"{% if not item.equipped %} display="none"{% endif %}/>{% endfor %}

  <!-- 4. trophy shelf: every achievement is a trophy; locked ones are silhouettes -->
  <g class="mr-shelf">
    <rect x="642" y="168" width="276" height="10" rx="3" fill="#8a5a3c"/><rect x="642" y="268" width="276" height="10" rx="3" fill="#8a5a3c"/>

    {% for t in room_trophies %}
    <g class="mr-trophy{% if t.earned %} is-earned{% else %} is-locked{% endif %}" transform="translate({{ t.x }} {{ t.y }})" data-trophy="{{ t.code }}">
      <title>{{ t.title }} — {% if t.earned %}earned{% else %}locked: {{ t.description }}{% endif %}</title>
      <use href="#mrTrophy{% if t.shape == 'medal' %}Medal{% elif t.shape == 'book' %}Book{% elif t.shape == 'star' %}Star{% else %}Cup{% endif %}"/>

    {% endfor %}

  <rect y="430" width="960" height="170" fill="url(#mrFloor)"/>
  <g stroke="#b88a5c" stroke-width="2" opacity=".55"><path d="M0 468H960M0 512H960M0 560H960"/><path d="M120 430V468M380 430V468M640 430V468M880 430V468M60 468V512M300 468V512M560 468V512M820 468V512M180 512V560M440 512V560M700 512V560M940 512V560M100 560V600M360 560V600M620 560V600M860 560V600"/></g>
