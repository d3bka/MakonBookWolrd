name: Docker image

# Builds nazacd/makonbook (the makonbook.uz web, Celery and Telegram bot image)
# and pushes it to Docker Hub. The VPS only pulls it (DEPLOY.md):
#   push to main      → :latest and :sha-<commit>
#   tag v1.2.3        → :1.2.3 and :sha-<commit>
#   manual run        → :sha-<commit> (any branch), to try a build first
#
# The production compose file uses `pull_policy: always`, so once :latest
# moves, the next `docker compose up` on the VPS runs it.
#
# Needs repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with read/write scope, not the account password).

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django tests
        env:
          SECRET_KEY: ci-only
          DEBUG: "True"
        run: |
          python manage.py makemigrations --check --dry-run --settings=satmakon.test_settings
          python manage.py test --settings=satmakon.test_settings --parallel 4

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: nazacd/makonbook
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
